<svg id="nexora-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <!-- Text Gradients -->
    <linearGradient id="nexoraTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    
    <linearGradient id="aiTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="iconRibbonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="iconRibbonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Group 1: 3D Glowing Ribbon 'N' Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Aura -->
    <circle cx="40" cy="40" r="38" fill="#6366F1" opacity="0.12" filter="blur(10px)"/>
    
    <!-- Orbital Glow Rings -->
    <ellipse cx="40" cy="40" rx="36" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-28 40 40)" opacity="0.9" filter="url(#neonGlow)"/>
    <ellipse cx="40" cy="40" rx="36" ry="14" fill="none" stroke="#FFFFFF" stroke-width="1" transform="rotate(-28 40 40)" opacity="0.6"/>

    <!-- Floating Sparkle Particles -->
    <circle cx="12" cy="22" r="2.5" fill="#38BDF8" filter="url(#neonGlow)"/>
    <circle cx="68" cy="58" r="2.5" fill="#F0ABFC" filter="url(#neonGlow)"/>
    <circle cx="70" cy="20" r="2" fill="#22D3EE" opacity="0.8"/>
    <circle cx="14" cy="62" r="2" fill="#A855F7" opacity="0.8"/>

    <!-- Main 3D Ribbon N Structure -->
    <!-- Left Leg -->
    <path d="M 22 62 C 20 48, 22 30, 26 18 C 28 14, 34 16, 33 22 C 31 34, 29 50, 28 62 C 27 68, 22 67, 22 62 Z" fill="url(#iconRibbonGrad1)"/>
    
    <!-- Diagonal Fold Ribbon -->
    <path d="M 24 20 C 32 30, 46 50, 56 64 C 60 69, 65 65, 62 58 C 52 44, 38 24, 30 16 C 26 12, 21 15, 24 20 Z" fill="url(#iconRibbonGrad2)" filter="url(#dropShadow)"/>

    <!-- Right Leg Ribbon -->
    <path d="M 54 62 C 54 48, 56 30, 60 18 C 62 14, 67 16, 66 22 C 64 34, 62 50, 60 62 C 59 68, 54 67, 54 62 Z" fill="url(#iconRibbonGrad1)"/>
    
    <!-- Foreground Highlighting Ribbon Sweep -->
    <path d="M 25 18 C 38 34, 48 48, 62 62" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" filter="url(#neonGlow)"/>
    
    <!-- Orbital Foreground Ring overlap -->
    <path d="M 12 48 A 36 14 0 0 0 68 32" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" transform="rotate(-28 40 40)" stroke-linecap="round"/>
  </g>

  <!-- Group 2: Crisp Legible Typography 'Nexora.ai' -->
  <g transform="translate(105, 62)">
    <!-- Nexora text with deep high-contrast gradient -->
    <text font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="-0.03em" fill="url(#nexoraTextGrad)">
      Nexora<tspan fill="url(#aiTextGrad)">.ai</tspan>
    </text>
  </g>
</svg>
